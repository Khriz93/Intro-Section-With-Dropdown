<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>

  <title>Frontend Mentor | Intro section with dropdown navigation</title>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <a href="#home" class="logo">
      <img src="./images/logo.svg" alt="Logo">
    </a>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false">
      <img src="./images/icon-menu.svg" alt="">
    </button>

    <div class="nav-menu">
      <button class="close-menu" aria-label="Close menu">
        <img src="./images/icon-close-menu.svg" alt="">
      </button>

      <div class="nav-left">
        <div class="dropdown">
          <button class="dropdown-btn">
            Features
            <img src="./images/icon-arrow-down.svg" alt="">
          </button>
          <div class="dropdown-menu icon-menu">
            <a href="#home">
              <img src="./images/icon-todo.svg" alt="">
              <span>Todo List</span>
            </a>
            <a href="#home">
              <img src="./images/icon-calendar.svg" alt="">
              <span>Calendar</span>
            </a>
            <a href="#home">
              <img src="./images/icon-reminders.svg" alt="">
              <span>Reminders</span>
            </a>
            <a href="#home">
              <img src="./images/icon-planning.svg" alt="">
              <span>Planning</span>
            </a>
          </div>
        </div>
        <div class="dropdown">
          <button class="dropdown-btn">
                Company
                <img src="./images/icon-arrow-down.svg" alt="">
          </button>
          <div class="dropdown-menu">
            <a href="#home">History</a>
            <a href="#home">Our Team</a>
            <a href="#home">Blog</a>
          </div>
        </div>
        <a href="#home">Careers</a>
        <a href="#home">About</a>
      </div> 

      <div class="nav-right">
        <a href="#home">Login</a>
        <a href="#home" class="register-btn">Register</a>
      </div>
    </div>
  </nav>
  <!-- End of Navigation Bar -->
  <main>
    <section class="hero">
      <div class="hero-img">
        <picture>
          <source media="(min-width:768px)" srcset="./images/image-hero-desktop.png">
          <img src="./images/image-hero-mobile.png" alt="">
        </picture>
      </div>
      <div class="hero-content">
        <div class="hero-text">
          <h1>Make<br class="desktop-break">
            remote work</h1>
          <p>
            Get your team in sync, no matter your location. Streamline processes, 
            create team rituals, and watch productivity soar.
          </p>
          <button class="learn-more-btn">Learn more</button>
        </div>
        <div class="client-logos">
            <img src="./images/client-databiz.svg" alt="Databiz">
            <img src="./images/client-audiophile.svg" alt="Audiophile">
            <img src="./images/client-meet.svg" alt="Meet">
            <img src="./images/client-maker.svg" alt="Maker">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
